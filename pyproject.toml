[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathfmt"
dynamic = ["version"]
description = "Typeset plain-text formulas in DOCX files as native Word equations — cross-platform, no Office required."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leo", email = "gml853503962@gmail.com" }]
keywords = ["docx", "word", "math", "omml", "equation", "typesetting", "cross-platform"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Office Suites",
  "Topic :: Text Processing :: Markup :: XML",
]
dependencies = ["lxml>=5.0"]

[project.optional-dependencies]
# ruff is pinned to one minor series on purpose. It is pre-1.0, so its
# formatter's stable style may change in any 0.x.0 — 0.16.0 began formatting
# Python blocks inside Markdown, which turned a green local run into a
# nine-platform CI failure with no code change behind it. `<0.17` keeps a new
# formatting generation from arriving unannounced; the floor matches, so a
# contributor's `pip install -e ".[dev]"` and CI agree on one style rather than
# disagreeing until a push. Raising both bounds together is a deliberate step:
# read ruff's changelog, run `ruff format` once, and commit the result.
dev = ["build>=1.2", "pytest>=8.0", "pytest-cov>=7.0", "ruff>=0.16,<0.17"]

[project.scripts]
mathfmt = "mathfmt.cli:main"

[project.urls]
Homepage = "https://github.com/Gmlleo/mathfmt"
Repository = "https://github.com/Gmlleo/mathfmt"
Issues = "https://github.com/Gmlleo/mathfmt/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = {attr = "mathfmt._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=mathfmt --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov --cov-fail-under=85"
testpaths = ["tests"]
filterwarnings = [
  "ignore::pytest.PytestCacheWarning",
]
markers = [
  "native_xsl: requires Microsoft Office MML2OMML.XSL",
]

[tool.coverage.run]
branch = true
source = ["mathfmt"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 110
target-version = "py310"
# Ruff 0.16 began formatting Python code blocks inside Markdown. The docs here
# quote *fragments* — lines lifted out of a re.compile(...) call, a method body
# shown without its class — and formatting each fence as a standalone module
# strips the indentation that shows where the excerpt belongs and inserts blank
# lines between what were adjacent lines. That damages the documents rather
# than tidying them, so Markdown is not ruff's to format. Python snippets in
# docs stay the maintainer's responsibility to keep readable.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["F", "I", "UP"]
