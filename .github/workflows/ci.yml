name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.11" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.14" }
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.10" }
          - { os: macos-latest, python-version: "3.14" }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not native_xsl"
      - name: Test native Office XSL when available
        if: runner.os == 'Windows'
        run: pytest -m native_xsl --no-cov
      - run: mathfmt --version
      - name: Add coverage summary
        shell: bash
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("coverage.xml").getroot()
          percent = float(root.attrib["line-rate"]) * 100
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as stream:
              stream.write(f"## Coverage\n\n**{percent:.1f}%** line coverage on {os.name}.\n")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: mathfmt --version
      - name: Verify doctor starts without Office
        run: python -c "import subprocess; r = subprocess.run(['mathfmt', 'doctor']); assert r.returncode in (0, 1)"
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/

  performance:
    name: 100-page performance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Benchmark scan, conversion, and validation
        run: |
          python benchmarks/benchmark_large_docx.py \
            --pages 100 \
            --formulas-per-page 8 \
            --max-scan-seconds 5 \
            --max-apply-seconds 5 \
            --max-validate-seconds 8 \
            --max-peak-memory-mb 256 \
            --json work/performance-v1.json
      - uses: actions/upload-artifact@v7
        with:
          name: performance-v1
          path: work/performance-v1.json

  exe-smoke-test:
    name: Standalone GUI executable smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]" pyinstaller
      - run: python packaging/build_exe.py
      - run: python packaging/smoke_test.py

  libreoffice-render:
    name: LibreOffice render smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MathFmt and render dependencies
        run: |
          python -m pip install -e ".[dev]"
          sudo apt-get update
          sudo apt-get install --yes libreoffice-writer poppler-utils
      - name: Generate and convert the v0.4 acceptance document
        run: |
          mkdir -p work/libreoffice-qa
          python -c "from pathlib import Path; from tests.acceptance import gen_docs; gen_docs.OUT = Path('work/libreoffice-qa'); gen_docs.doc06_v040()"
          mathfmt scan work/libreoffice-qa/doc06_v040.docx --report work/libreoffice-qa/review.json
          mathfmt apply work/libreoffice-qa/doc06_v040.docx --review work/libreoffice-qa/review.json --output work/libreoffice-qa/formatted.docx --report work/libreoffice-qa/result.json --strict
          mathfmt validate work/libreoffice-qa/formatted.docx --review work/libreoffice-qa/review.json --compatibility wps --report work/libreoffice-qa/validation.json
      - name: Render and reject visible Word-only alignment markers
        run: |
          mkdir -p /tmp/mathfmt-lo-profile
          libreoffice --headless -env:UserInstallation=file:///tmp/mathfmt-lo-profile --convert-to pdf --outdir work/libreoffice-qa work/libreoffice-qa/formatted.docx
          pdftotext work/libreoffice-qa/formatted.pdf work/libreoffice-qa/formatted.txt
          python -c "from pathlib import Path; text = Path('work/libreoffice-qa/formatted.txt').read_text(encoding='utf-8'); assert 'MathFmt v0.4 Visual Acceptance' in text; assert '&' not in text, text"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: libreoffice-render-smoke
          path: |
            work/libreoffice-qa/formatted.pdf
            work/libreoffice-qa/result.json
            work/libreoffice-qa/validation.json
